global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ["prometheus:9090"]
      
  - job_name: 'event-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8081']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']